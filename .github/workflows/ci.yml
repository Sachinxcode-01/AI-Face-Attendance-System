name: SmartFace Attendance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-client:
    name: Flutter Mobile Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create compatibility links
        working-directory: ${{ github.workspace }}
        run: |
          ln -sfn mobile smartface_mobile
          ln -sfn backend/api smartface_node_api
          ln -sfn backend/ai smartface_pro_api
          ln -sfn frontend/web smartface_landing_web

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create placeholder env files
        run: touch .env .env.development .env.staging .env.production

      - name: Install Dependencies
        run: flutter pub get

      # Advisory (non-blocking) until the formatting/analyzer backlog is cleared.
      - name: Check Code Formatting
        run: dart format --output none lib/ test/
        continue-on-error: true

      - name: Static Code Analysis
        run: flutter analyze
        continue-on-error: true

      - name: Run Unit & Widget Tests
        run: flutter test
        continue-on-error: true

  fastapi-backend:
    name: FastAPI Python Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create compatibility links
        working-directory: ${{ github.workspace }}
        run: |
          ln -sfn mobile smartface_mobile
          ln -sfn backend/api smartface_node_api
          ln -sfn backend/ai smartface_pro_api
          ln -sfn frontend/web smartface_landing_web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Build Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev

      - name: Install Python Linter & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff numpy cython

      - name: Lint Python Code with Ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Python Imports & Code Compilation
        run: python -m compileall -q .

  node-backend:
    name: Node.js API Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create compatibility links
        working-directory: ${{ github.workspace }}
        run: |
          ln -sfn mobile smartface_mobile
          ln -sfn backend/api smartface_node_api
          ln -sfn backend/ai smartface_pro_api
          ln -sfn frontend/web smartface_landing_web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/api/package-lock.json

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Code Linter
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script defined in package.json. Skipping linter."
          fi
